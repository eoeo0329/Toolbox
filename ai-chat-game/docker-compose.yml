# 一键启动：docker compose up -d
# 访问 http://localhost:8080 即可
#
# 环境变量（放在 .env 里，或者 docker compose up 前 export 出去）：
#   JWT_SECRET              任意长随机字符串
#   ENCRYPTION_KEY          32 字符字符串
#   API_KEY_DEEPSEEK        你的 DeepSeek Key
#   VITE_API_BASE           留空即可（走同源 /api 反代）

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-please}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-01234567890123456789012345678901}
      API_KEY_DEEPSEEK: ${API_KEY_DEEPSEEK:-}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"
