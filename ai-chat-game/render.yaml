# Render 一键部署配置
# 用法：在 render.com 新建服务时选择「使用 render.yaml」，或连接仓库后自动识别
#
# 后端需要配置以下环境变量（在 Render Dashboard 的 Environment 里填）：
#   JWT_SECRET              任意长随机字符串
#   ENCRYPTION_KEY          32 字符任意字符串
#   API_KEY_DEEPSEEK        你的 DeepSeek API Key（sk- 开头）
#   NODE_ENV                production

services:
  - type: web
    name: ai-challenge-server
    runtime: node
    rootDir: server
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
    autoDeploy: yes
